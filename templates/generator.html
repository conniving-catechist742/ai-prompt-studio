{% extends "base.html" %}{% block content %}<h1>Prompt oluştur</h1><form method="post"><label>Konu<input name="topic" required></label><label>Hedef kitle<input name="audience"></label><label>Ton<input name="tone"></label><button>Üret</button></form>{% if result %}<form method="post" action="/prompts"><label>Başlık<input name="title" value="Yeni prompt" required></label><label>Prompt<textarea name="body" rows="8" required>{{ result }}</textarea></label><label>Etiketler<input name="tags" placeholder="youtube, içerik"></label><button>Kaydet</button></form>{% endif %}{% endblock %}
